name: 기능 및 개선 제안
description: 새로운 기능, 사용성, 디자인 또는 내부 구조 개선을 제안해 주세요.
title: "[Improvement] "
body:
  - type: markdown
    attributes:
      value: |
        해결하려는 문제와 기대하는 결과를 중심으로 작성해 주세요.
        구현 방법이 확정되지 않았다면 아이디어 수준으로 작성해도 괜찮습니다.

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 점이 불편하거나 개선이 필요한가요?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
      description: 무엇을 어떻게 바꾸면 좋을지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 기대하는 결과
      description: 변경 이후 어떤 상태가 되면 완료된 것으로 볼 수 있나요?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 다른 방법
      description: 대안이나 우회 방법이 있다면 적어 주세요.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 참고 자료
      description: 관련 페이지, 기존 이슈, 공식 문서 등을 링크해 주세요.
    validations:
      required: false
