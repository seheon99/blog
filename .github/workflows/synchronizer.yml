name: Synchronizer

on:
  repository_dispatch:
    types: ["content_updated"]

concurrency:
  group: content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s" "${{ secrets.SYNC_CONTENTS_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Sync posts to obsidian vault
        id: check
        run: |
          git submodule sync --recursive
          git config submodule.src/content/posts.url git@github.com:seheon99/blog-obsidian-vault
          git submodule update --init --remote --checkout src/content/posts
          if git status --porcelain | grep .; then
            echo "changed=true" >> $GITHUB_OUTPUT
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git checkout -B 'automation/content-sync'
            git add src/content/posts
            git commit -m "chore(content): sync post contents"
            git push -f origin 'automation/content-sync'
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No content changes"
          fi

  validate:
    runs-on: ubuntu-latest
    needs: sync
    if: needs.sync.outputs.has_changes == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/content-sync

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s" "${{ secrets.SYNC_CONTENTS_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Checkout posts submodule
        run: |
          git submodule sync --recursive
          git config submodule.src/content/posts.url git@github.com:seheon99/blog-obsidian-vault
          git submodule update --init --checkout src/content/posts

      - uses: seheon99/build-and-deploy@v1
        with:
          dry-run: true
          skip-checkout: true

  merge:
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ssh-key: ${{ secrets.SYNC_CONTENTS_KEY }}
          fetch-depth: 0

      - name: Fast-forward merge to main
        run: |
          git checkout main
          git reset --hard origin/main
          git fetch origin automation/content-sync
          git merge --ff-only origin/automation/content-sync
          git push origin main
