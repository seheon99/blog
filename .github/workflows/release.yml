name: Releaser

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: seheon99/blog-obsidian-vault
          path: src/content/posts
          fetch-depth: 0
      - uses: seheon99/build-and-deploy@v1
        with:
          service-name: blog
          registry: ghcr.io/${{ github.repository }}
          dry-run: ${{ github.event_name == 'pull_request' }}
          submodules: true
          fetch-depth: 0
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-port: ${{ secrets.SSH_PORT || 22 }}
